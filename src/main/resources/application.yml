spring:
  application:
    name: asupg-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: asupg
      username: asupg_user
      password: asupg_pass

server:
  servlet:
    context-path: /api/asupg-service
  port: 8080

asupg:
  billing:
    free-period: 1 # Amount of years for which companies are free to use the service
    monthly-rate: 100000 # Default monthly rate which will be used unless specified otherwise

security:
  jwt:
    expireInMinutes: 60
    secret: ${security.jwt.secret}
  public-endpoints:
    - /v1/auth/login
    - /v3/api-docs/**
    - /swagger-ui
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/asupg-service/swagger-ui/**
    - /api/asupg-service/v3/api-docs/**