spring:
  application:
    name: asupg-service
  data:
    mongodb:
      host: ${mongodb.host}
      port: ${mongodb.port}
      database: ${mongodb.database}
      username: ${mongodb.username}
      password: ${mongodb.password}

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mongo:
      enabled: true


asupg-workers:
  url: ${asupg-workers.url}


server:
  servlet:
    context-path: /api/asupg-service
  port: 8080

asupg:
  billing:
    free-period: 1 # Amount of years for which companies are free to use the service
    monthly-rate: 100000 # Default monthly rate which will be used unless specified otherwise

security:
  jwt:
    expireInMinutes: 60
    secret: ${security.jwt.secret}
  public-endpoints:
    - /v1/auth/login
    - /v3/api-docs/**
    - /swagger-ui
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/asupg-service/swagger-ui/**
    - /api/asupg-service/v3/api-docs/**
    - /actuator/health

info:
  app:
    name: asupg-service
    version: 1.0.4
    description: ASUPG backend service